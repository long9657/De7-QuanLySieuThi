# Kết nối MySQL (có thể ghi đè khi chạy: -Dqlst.db.url=... -Dqlst.db.user=... -Dqlst.db.password=...)
# createDatabaseIfNotExist: lần chạy đầu tự tạo database qlst; DAO tự tạo bảng (schema.sql) và nạp seed.sql
qlst.db.url=jdbc:mysql://localhost:3306/qlst?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
qlst.db.user=root
qlst.db.password=long
